# Hanabira static-export stack nginx config (Phase 3).
# Used by the Dockhand test stack (stronghold repo compose/hanabira.yaml), which
# bind-mounts this file to /etc/nginx/conf.d/default.conf:ro.
#
# Serves the Next.js static export from /usr/share/nginx/html and proxies the
# three API prefixes to the old backends on the hanabira-internal network.
server {
    listen 80;

    location /e-api/v1/ {
        proxy_pass http://express-db:8000/e-api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /f-api/v1/ {
        proxy_pass http://flask-dynamic-db:5100/f-api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location /d-api/v1/ {
        proxy_pass http://dictionary-db:5200/d-api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location / {
        root /usr/share/nginx/html;
        # static export emits route.html (not route/index.html)
        try_files $uri $uri.html $uri/ /404.html;
    }
}
